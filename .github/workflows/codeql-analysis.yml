name: "CodeQL"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    # Uploading results to code scanning needs security-events: write. Without
    # it the upload fails with "Resource not accessible by integration".
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout repo
      uses: actions/checkout@v7

    # CodeQL builds the module to analyse it, so it needs the toolchain the
    # modules require. setup-go spells release candidates as semver, unlike the
    # go directive's 1.27rc2.
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        # Not go-version-file: setup-go normalises the go directive's 1.27rc2
        # to 1.27, which has no release. Once 1.27 ships, every workflow can
        # read go.mod instead of repeating the version.
        go-version: 1.27.0-rc.2

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: go

    - name: CodeQL Analysis
      uses: github/codeql-action/analyze@v4
