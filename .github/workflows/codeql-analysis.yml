name: "CodeQL"

on:
  push:
    branches: [ main ]

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    # Uploading results to code scanning needs security-events: write. Without
    # it the upload fails with "Resource not accessible by integration".
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout repo
      uses: actions/checkout@v6

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: go

    - name: CodeQL Analysis
      uses: github/codeql-action/analyze@v4
