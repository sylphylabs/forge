name: Go

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        # Every go.mod requires go 1.27rc3, so that is what the blocking job
        # must run. setup-go spells release candidates in semver form, unlike
        # the go directive. Once 1.27 ships, every workflow can read go.mod
        # instead of repeating the version.
        go: [1.27.0-rc.3]
    name: build & test
    runs-on: ubuntu-latest
    services:
      etcd:
        image: gcr.io/etcd-development/etcd:v3.5.0
        ports:
          - 2379:2379
        env:
          ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
          ETCD_ADVERTISE_CLIENT_URLS: http://0.0.0.0:2379
      consul:
        image: hashicorp/consul:1.20
        ports:
          - 8500:8500
      nacos:
        image: nacos/nacos-server:v2.1.0
        env:
          MODE: standalone
        ports:
          - "8848:8848"
          - "9848:9848"
      polaris:
        image: polarismesh/polaris-standalone:latest
        ports:
          - 8090:8090
          - 8091:8091
          - 8093:8093
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: Setup Environment
        run: |
          echo "GOPATH=$(go env GOPATH)" >> $GITHUB_ENV
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Module cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go

      - name: Build
        run: go build ./...
        env:
          GOTOOLCHAIN: auto

      - name: Protobuf
        run: make proto-check
        env:
          GOTOOLCHAIN: auto

      - name: Test
        run: make test-coverage
        env:
          GOTOOLCHAIN: auto

      - name: Upload coverage to Codecov
        run: bash <(curl -s https://codecov.io/bash)

      - name: Generator module
        run: |
          cd cmd
          GOWORK=off go build ./...
          GOWORK=off go test -race ./...
        env:
          GOTOOLCHAIN: auto

  generate:
    name: generated code drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.0-rc.3

      - name: Module cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go

      # The Makefile pins the Buf CLI, and buf.gen.yaml runs every plugin with
      # `go run`, so the root and cmd go.mod files pin the generator versions.
      # No separate installs are needed for the regeneration to be reproducible.
      - name: Regenerate committed code
        run: make generate
        env:
          GOTOOLCHAIN: auto

      - name: Verify committed code matches the generators
        run: |
          git diff --exit-code
          untracked=$(git status --porcelain)
          if [ -n "$untracked" ]; then
            echo "generation produced files that are not committed:"
            echo "$untracked"
            exit 1
          fi

  consumer:
    name: external consumer build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.0-rc.3

      # An external `go get` sees the root module as the proxy packs it:
      # without the nested api/, cmd/, and contrib/ modules, and with no
      # effect from any replace directive. Building a consumer against that
      # shape is the one test that fails if a require ever points at an
      # untagged internal module again.
      - name: Build a consumer against the packed module shape
        run: |
          packed=$(mktemp -d)
          git archive HEAD | tar -x -C "$packed"
          rm -rf "$packed/api" "$packed/cmd" "$packed/contrib"

          consumer=$(mktemp -d)
          cd "$consumer"
          cat > go.mod <<EOF
          module example.com/consumer

          go 1.27rc3

          require github.com/sylphylabs/forge v0.0.0
          replace github.com/sylphylabs/forge => $packed
          EOF
          cat > main.go <<'EOF'
          package main

          import (
          	"github.com/sylphylabs/forge"
          	"github.com/sylphylabs/forge/errors"
          	"github.com/sylphylabs/forge/transport/grpc"
          	"github.com/sylphylabs/forge/transport/http"
          )

          func main() {
          	app := forge.New(
          		forge.WithName("consumer"),
          		forge.WithServer(
          			http.NewServer(http.WithAddress(":8000")),
          			grpc.NewServer(grpc.WithAddress(":9000")),
          		),
          	)
          	_ = app
          	_ = errors.Of(errors.KindNotFound)
          }
          EOF
          GOWORK=off GOFLAGS=-mod=mod go mod tidy
          GOWORK=off go build ./...
        env:
          GOTOOLCHAIN: auto

  forward-go:
    name: Go tip forward compatibility
    runs-on: ubuntu-latest
    # Advisory: it watches the next toolchain, so an upstream regression must
    # not block this repository. The required toolchain is exercised by the
    # build job above.
    continue-on-error: true
    # gotip compiles the toolchain from source, so this job is slower than the
    # rest. Bound it rather than letting a hung build hold a runner.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # A released toolchain cannot serve this job: setup-go installs only the
      # Go team's binaries, and every release is older than the 1.27 candidate
      # the modules require. Build tip from source instead — that is the version
      # this job exists to watch.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      # Key the cache on the commit gotip would build, so a new tip rebuilds
      # and an unchanged one does not.
      - name: Resolve tip
        id: tip
        run: echo "sha=$(git ls-remote https://go.googlesource.com/go refs/heads/master | cut -f1)" >>"$GITHUB_OUTPUT"
      - name: Restore gotip
        id: gotip-cache
        uses: actions/cache@v6
        with:
          path: ~/sdk/gotip
          key: ${{ runner.os }}-gotip-${{ steps.tip.outputs.sha }}

      - name: Install gotip
        run: |
          go install golang.org/dl/gotip@latest
          # download always reruns make.bash, so skip it when the cache already
          # holds a built toolchain. The wrapper refuses to run without
          # .unpacked-success, which installTip does not write, so create it
          # here: a compiled bin/go is the evidence the build finished.
          if [ -x "$HOME/sdk/gotip/bin/go" ]; then
            touch "$HOME/sdk/gotip/.unpacked-success"
          else
            gotip download
          fi
          gotip version
      - name: Test core
        run: gotip test ./...
      - name: Test generator modules
        run: |
          cd cmd
          GOWORK=off gotip test ./...

  e2e:
    name: cross-service e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.0-rc.3

      # Two Forge services in containers, calling each other over a real
      # network. Every other job runs in one process, where a mistake in how a
      # test reaches the code can look like a passing contract; this job is what
      # catches that.
      - name: Cross-service tests
        run: |
          cd internal/e2e
          FORGE_E2E=1 go test -race -count=1 -v ./...

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    # Advisory: a newly published vulnerability in a dependency must not block
    # unrelated changes. The report is the signal; fixing it is its own change.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.0-rc.3

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
        env:
          GOTOOLCHAIN: auto

      # govulncheck analyzes one module at a time; walk every go.mod the same
      # way hack/tools.sh does.
      - name: Scan all modules
        run: |
          status=0
          for mod in $(find . -not \( \( -path './output' -o -path './.git' -o -path '*/vendor/*' \) -prune \) -name go.mod -print0 | xargs -0 -I {} dirname {} | sort); do
            echo "govulncheck $mod"
            (cd "$mod" && govulncheck ./...) || status=1
          done
          exit $status
        env:
          GOTOOLCHAIN: auto
