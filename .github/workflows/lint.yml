name: Lint

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  resolve-modules:
    name: resolve module
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - id: set-matrix
        run: ./hack/resolve-modules.sh

  lint:
    name: lint module
    runs-on: ubuntu-latest
    needs: resolve-modules
    strategy:
      # Report every failing module in one run instead of cancelling the rest.
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve-modules.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # Not go-version-file: setup-go normalises the go directive's 1.27rc2
          # to 1.27, which has no release. Spell the candidate as semver, the
          # same way the Go workflow does. Once 1.27 ships, every workflow can
          # read go.mod instead of repeating the version.
          go-version: 1.27.0-rc.2
      # The released golangci-lint binaries are built with Go 1.26 and refuse to
      # run against our 1.27 modules ("the Go language version used to build
      # golangci-lint is lower than the targeted Go version"). Build it from
      # source with our own toolchain instead of using golangci-lint-action.
      - name: Lint
        working-directory: ${{ matrix.workdir }}
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@$GOLANGCI_VERSION run
        env:
          GOLANGCI_VERSION: v2.12.2
          GOTOOLCHAIN: auto
