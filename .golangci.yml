version: "2"
run:
  modules-download-mode: readonly
linters:
  default: none
  enable:
    - bodyclose
    - dogsled
    - durationcheck
    - errcheck
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - mnd
    - prealloc
    - revive
    # TODO: re-enable once staticcheck supports Go 1.27. v0.7.0 (the newest
    # release, predating the 1.27 candidates) panics building IR for the
    # linux/amd64 internal/poll: "unexpected expr: *ast.KeyValueExpr". Every
    # module fails, and only on Linux — darwin/arm64 lacks the offending code.
    # - staticcheck
    - unconvert
    - unused
    - wastedassign
    - whitespace
  settings:
    gocyclo:
      min-complexity: 50
    govet:
      enable:
        - shadow
    lll:
      line-length: 160
    misspell:
      locale: US
    mnd:
      checks:
        - case
        - condition
        - return
    whitespace:
      # multi-func would require a blank line after a multi-line signature,
      # which gofumpt then removes. gofumpt wins: it is the stricter formatter
      # and the one that rewrites files.
      multi-func: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - goconst
        path: (.+)_test\.go
      # Tests scope errors per step with `if err := ...`, which reads better
      # than reusing one variable, and table fixtures hold wire payloads that
      # cannot be wrapped without changing what is asserted.
      - linters:
          - govet
        path: (.+)_test\.go
        text: 'shadow: declaration of "err"'
      - linters:
          - lll
        path: (.+)_test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/sylphylabs
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
