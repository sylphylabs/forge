syntax = "proto3";

package sylphy.errors.v1;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/sylphylabs/forge/api/errors/v1;errors";
option java_multiple_files = true;
option java_package = "com.github.sylphy.errors.v1";

// Kind classifies a failure independently of any transport. It is the single
// source of truth for an error's category: transports project a Kind onto their
// own status vocabulary, never the reverse.
//
// The values are the annotation vocabulary for declaring contract errors on
// enums. Each value is the KIND_-prefixed spelling of the wire name the Forge
// runtime uses (KIND_NOT_FOUND names the kind that travels as "NOT_FOUND"):
// the prefix is Protobuf enum scoping, not part of the name. There is no
// Protobuf error envelope; HTTP carries errors as Problem Details and gRPC as
// a status with standard details.
enum Kind {
  KIND_UNSPECIFIED = 0;
  KIND_INVALID_ARGUMENT = 1;
  KIND_FAILED_PRECONDITION = 2;
  KIND_OUT_OF_RANGE = 3;
  KIND_UNAUTHENTICATED = 4;
  KIND_PERMISSION_DENIED = 5;
  KIND_NOT_FOUND = 6;
  KIND_ALREADY_EXISTS = 7;
  KIND_CONFLICT = 8;
  KIND_RESOURCE_EXHAUSTED = 9;
  KIND_CANCELED = 10;
  KIND_DEADLINE_EXCEEDED = 11;
  KIND_UNAVAILABLE = 12;
  KIND_UNIMPLEMENTED = 13;
  KIND_INTERNAL = 14;
  KIND_DATA_LOSS = 15;
}

// default_kind declares the default classification for an error enum.
extend google.protobuf.EnumOptions {
  Kind default_kind = 500101;
}

// kind overrides the classification for one error enum value.
extend google.protobuf.EnumValueOptions {
  Kind kind = 500102;
}
