syntax = "proto3";

package sylphy.test.v1;

import "google/protobuf/descriptor.proto";
import "sylphy/errors/v1/errors.proto";
import "sylphy/openapi/v1/annotations.proto";

option go_package = "example.com/sylphy/api-consumer/test/v1;testv1";

option (sylphy.openapi.v1.document) = {
  title: "Document API"
  version: "1.0.0"
  description: "Manages documents."
  servers: {url: "https://api.example.com", description: "Production"}
  security_schemes: {
    name: "bearer"
    description: "Service-issued JWT."
    http_bearer: {bearer_format: "JWT"}
  }
  security_schemes: {
    name: "api_key"
    api_key_header: {header: "X-Api-Key"}
  }
};

enum FailureReason {
  option (sylphy.errors.v1.default_kind) = KIND_INTERNAL;

  FAILURE_REASON_UNSPECIFIED = 0;
  FAILURE_REASON_NOT_FOUND = 1 [(sylphy.errors.v1.kind) = KIND_NOT_FOUND];
  FAILURE_REASON_DENIED = 2 [(sylphy.errors.v1.kind) = KIND_PERMISSION_DENIED];
}

// The application declares its own typed throws extensions — the field type
// is its own error enum, so the compiler rejects a reason that does not
// exist — and the (sylphy.errors.v1.throws) marker is what lets generators
// claim them. The extension numbers are arbitrary picks from the
// organization-internal 50000–99999 range.
extend google.protobuf.MethodOptions {
  repeated FailureReason throws = 50000 [(sylphy.errors.v1.throws) = true];
}

extend google.protobuf.ServiceOptions {
  repeated FailureReason service_throws = 50001 [(sylphy.errors.v1.throws) = true];
}

message GetDocumentRequest {
  option (sylphy.openapi.v1.schema) = {description: "Request to fetch one document."};

  string name = 1 [(sylphy.openapi.v1.field) = {
    description: "Resource name of the document."
    example: "documents/1"
  }];
}

message GetDocumentReply {
  string name = 1;
}

service DocumentService {
  // Every method of this service can be denied.
  option (service_throws) = FAILURE_REASON_DENIED;

  rpc GetDocument(GetDocumentRequest) returns (GetDocumentReply) {
    option idempotency_level = IDEMPOTENT;
    option (throws) = FAILURE_REASON_NOT_FOUND;
    option (sylphy.openapi.v1.operation) = {
      summary: "Get one document"
      tags: "documents"
      security: {schemes: "bearer"}
    };
  }
}
