version: v2
# Generates the committed test fixtures. The public API module has its own
# pipeline; run `make -C api generate` for api/.
inputs:
  - directory: .
    paths:
      - contrib/middleware/validate/internal/testdata
      - internal/testdata
plugins:
  # protoc-gen-go is pinned by the root go.mod; the remaining plugins run
  # inside the cmd module (-C cmd) so cmd/go.mod pins their versions.
  - local:
      - go
      - run
      - google.golang.org/protobuf/cmd/protoc-gen-go
    out: .
    opt:
      - paths=source_relative
  - local:
      - go
      - run
      - -C
      - cmd
      - google.golang.org/grpc/cmd/protoc-gen-go-grpc
    out: .
    opt:
      - paths=source_relative
  - local:
      - go
      - run
      - -C
      - cmd
      - ./protoc-gen-go-errors
    out: .
    opt:
      - paths=source_relative
  - local:
      - go
      - run
      - -C
      - cmd
      - ./protoc-gen-go-http
    out: .
    opt:
      - paths=source_relative
  - local:
      - go
      - run
      - -C
      - cmd
      - ./protoc-gen-go-middleware
    out: .
    opt:
      - paths=source_relative
      - http=annotated
      - grpc=true
  # The merged OpenAPI document is a build artifact, not a committed fixture.
  - local:
      - go
      - run
      - -C
      - cmd
      - ./protoc-gen-openapi
    out: build
    strategy: all
