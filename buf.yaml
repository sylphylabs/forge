version: v2
modules:
  - path: .
    excludes:
      - cmd/protoc-gen-go-errors
      - third_party
deps:
  - buf.build/bufbuild/protovalidate
  - buf.build/googleapis/googleapis
lint:
  use:
    - STANDARD
  ignore:
    - cmd/protoc-gen-go-http/testdata
    - contrib/middleware/validate/internal/testdata
    - internal/testdata
breaking:
  use:
    - FILE
