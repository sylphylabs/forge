edition = "2023";

package openkratos.opaque.v1;

import "google/api/annotations.proto";
import "google/protobuf/go_features.proto";

option go_package = "opaque.test/testpb";
option features.(pb.go).api_level = API_OPAQUE;

message Payload {
  string value = 1;
}

message MessageRequest {
  Payload payload = 1;
}

message MessageReply {
  Payload payload = 1;
}

message ScalarRequest {
  string text = 2;
  string query = 3;
}

message ScalarReply {
  string text = 2;
}

message RepeatedRequest {
  repeated string tags = 3;
}

message RepeatedReply {
  repeated string tags = 3;
}

message MapRequest {
  map<string, string> labels = 4;
}

message MapReply {
  map<string, string> labels = 4;
}

message WholeRequest {
  string name = 1;
  int64 count = 2;
}

message WholeReply {
  string name = 1;
  int64 count = 2;
}

service OpaqueService {
  rpc MessageBody(MessageRequest) returns (MessageReply) {
    option (google.api.http) = {
      post: "/v1/message"
      body: "payload"
      response_body: "payload"
    };
  }

  rpc ScalarBody(ScalarRequest) returns (ScalarReply) {
    option (google.api.http) = {
      post: "/v1/scalar"
      body: "text"
      response_body: "text"
    };
  }

  rpc RepeatedBody(RepeatedRequest) returns (RepeatedReply) {
    option (google.api.http) = {
      post: "/v1/repeated"
      body: "tags"
      response_body: "tags"
    };
  }

  rpc MapBody(MapRequest) returns (MapReply) {
    option (google.api.http) = {
      post: "/v1/map"
      body: "labels"
      response_body: "labels"
    };
  }

  rpc WholeBody(WholeRequest) returns (WholeReply) {
    option (google.api.http) = {
      post: "/v1/whole/{name}"
      body: "*"
    };
  }
}
