syntax = "proto3";

package testdata;

import "buf/validate/validate.proto";

option go_package = "github.com/sylphylabs/forge/contrib/middleware/validate/internal/testdata";

message Modern {
  string name = 1 [(buf.validate.field).string.min_len = 5];
  int32 age = 2 [(buf.validate.field).int32.gt = 18];
}
